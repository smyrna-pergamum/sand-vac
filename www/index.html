<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#bfe6f7" />
  <title>Sand Vac</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="btnMenu" class="icon-btn" aria-label="Menü">☰</button>
    <div class="titles">
      <strong id="title">Sand Vac</strong>
      <span id="subtitle"></span>
    </div>
    <button id="btnSound" class="icon-btn" aria-label="Ses">🔊</button>
    <button id="btnRestart" class="icon-btn" aria-label="Yeniden başlat">↻</button>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
  </main>

  <section id="menu" class="overlay">
    <div class="panel menu-panel">
      <h1>Sand Vac</h1>
      <p class="tagline">Altta bulmacayı çöz, süpürgeleri kazan, üstteki kumdan tabloyu tertemiz yap.</p>
      <button id="btnPlay" class="primary">Oyna</button>
      <div id="levels" class="levels"></div>
    </div>
  </section>

  <section id="result" class="overlay hidden">
    <div class="panel">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="btnNext" class="primary">Sonraki bölüm</button>
      <button id="btnRetry" class="secondary">Tekrar dene</button>
      <button id="btnResMenu" class="link">Bölümler</button>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
